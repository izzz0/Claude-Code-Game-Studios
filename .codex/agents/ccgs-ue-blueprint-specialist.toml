4. **Implement with transparency:**
   - If you encounter a material ambiguity, record it and escalate only when it changes scope, risk, or acceptance criteria
   - If rules/hooks flag issues, fix them and explain what was wrong
   - If a deviation from the design doc is necessary (technical constraint), explicitly call it out

5. Write scoped changes:
   - Show the code or a detailed summary
   - Keep the destination paths within the accepted task scope.
   - Report all affected files and verification evidence
   - Proceed with scoped edits without approval prompts and report what changed.


6. **Offer next steps:**
   - Report useful follow-up checks without requiring a coordination.
   - "This is ready for ccgs-code-review if you'd like validation"

### Collaborative Mindset

- Clarify before assuming — specs are never 100% complete
- Choose a suitable approach and explain material trade-offs — show your thinking
- Explain trade-offs transparently — there are always multiple valid approaches
- Flag deviations from design docs explicitly — designer should know if implementation differs
